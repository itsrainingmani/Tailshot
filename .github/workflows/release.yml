name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Native Host
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: tailscale_sender_host.exe
            output_name: tailscale_sender_host_windows_amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: tailscale_sender_host
            output_name: tailscale_sender_host_darwin_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: tailscale_sender_host
            output_name: tailscale_sender_host_darwin_arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: tailscale_sender_host
            output_name: tailscale_sender_host_linux_amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        working-directory: ./native-host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o ${{ matrix.binary_name }} -ldflags="-w -s" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ./native-host/${{ matrix.binary_name }}

  release:
    name: Create Release
    needs:
      - build
      - chrome-webstore
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: |
            ## Tailshot Release
            
            This release includes native host binaries for:
            - Windows (amd64)
            - macOS (Intel/amd64) 
            - macOS (Apple Silicon/arm64)
            - Linux (amd64)
            
            It also includes Chrome Web Store release artifacts:
            - Chrome Web Store upload zip
            - Windows reviewer/native-host package
            - Store screenshots and promo tile
            
            ### Installation
            
            1. Download the appropriate binary for your platform
            2. Place it in the correct directory (see README for details)
            3. Make it executable (macOS/Linux): `chmod +x tailscale_sender_host`
            4. Follow the installation instructions in the README
          files: |
            ./artifacts/tailscale_sender_host_windows_amd64.exe/tailscale_sender_host.exe
            ./artifacts/tailscale_sender_host_darwin_amd64/tailscale_sender_host
            ./artifacts/tailscale_sender_host_darwin_arm64/tailscale_sender_host
            ./artifacts/tailscale_sender_host_linux_amd64/tailscale_sender_host
            ./artifacts/tailshot-chrome-webstore/tailshot-chrome-webstore-*.zip
            ./artifacts/tailshot-windows-reviewer-package/tailshot-windows-*.zip
            ./artifacts/tailshot-store-assets/**/*.png

  chrome-webstore:
    name: Build Chrome Web Store Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($manifestVersion -ne $tagVersion) {
            throw "manifest.json version $manifestVersion does not match tag $tagVersion"
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build and validate release artifacts
        shell: pwsh
        run: .\installer\chrome-webstore\validate-release.ps1 -Build

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: tailshot-chrome-webstore
          path: ./dist/chrome-webstore/tailshot-chrome-webstore-*.zip

      - name: Upload Windows reviewer package
        uses: actions/upload-artifact@v4
        with:
          name: tailshot-windows-reviewer-package
          path: ./dist/tailshot-windows-*.zip

      - name: Upload store assets
        uses: actions/upload-artifact@v4
        with:
          name: tailshot-store-assets
          path: |
            ./store-assets/chrome-webstore/*.png
